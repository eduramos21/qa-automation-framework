# Copied into a project by /qa:init when ci.provider is github-actions.
# Adjust the working-directory to match stacks.web.root in qa.config.yml.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - run: pip install -r requirements.txt

      - name: install browsers
        run: playwright install --with-deps chromium

      - name: run suite
        run: pytest -n auto --tracing=retain-on-failure
        env:
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pytest-traces
          path: e2e/test-results/
          retention-days: 14
