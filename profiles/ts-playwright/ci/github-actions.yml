# Copied into a project by /qa:init when ci.provider is github-actions.
# Adjust the working-directory to match stacks.web.root in qa.config.yml.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: install browsers
        run: npx playwright install --with-deps chromium

      - name: run suite
        run: npx playwright test --forbid-only
        env:
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
